name: Build Mobile App

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm ci

      - name: Clear Angular build cache
        run: rm -rf .angular

      - name: Build Angular app for mobile
        run: npm run build:mobile

      - name: Clean Android directory
        run: rm -rf android

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Add Maven Central mirror fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path

          build_gradle = Path('android/build.gradle')
          contents = build_gradle.read_text()
          repository = '        mavenCentral()'
          mirror = (
              repository
              + "\n        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }"
          )

          if contents.count(repository) != 2:
              raise SystemExit('Expected buildscript and project Maven Central repositories.')

          build_gradle.write_text(contents.replace(repository, mirror))
          PY

      - name: Register .sbd file association in AndroidManifest
        run: |
          python3 - <<'EOF'
          import re

          with open('android/app/src/main/AndroidManifest.xml', 'r') as f:
              content = f.read()

          # Intent filters to inject into the MainActivity <activity> block.
          # Three filters for maximum compatibility:
          #   1. Custom MIME type (used when other apps know about us)
          #   2. content:// URIs from Files/Downloads app (most common on Android 10+)
          #   3. file:// URIs from older file managers
          intent_filters = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:mimeType="application/x-quickboard" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="content" android:mimeType="*/*"
                          android:pathPattern=".*\\.sbd" />
                  </intent-filter>
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="file" android:mimeType="*/*"
                          android:pathPattern=".*\\.sbd" />
                  </intent-filter>'''

          # Insert just before the first </activity> closing tag
          content = content.replace('</activity>', intent_filters + '\n        </activity>', 1)

          with open('android/app/src/main/AndroidManifest.xml', 'w') as f:
              f.write(content)

          print('AndroidManifest patched with .sbd intent filters.')
          EOF

      - name: Generate Android icons
        run: npx @capacitor/assets generate --android --assetPath branding/capacitor

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Check signing configuration
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEY_STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode keystore
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore

      - name: Build signed release APK
        if: steps.signing.outputs.has_keystore == 'true'
        env:
          KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android && ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/release.keystore \
            -Pandroid.injected.signing.store.password="$KEY_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Build debug APK
        if: steps.signing.outputs.has_keystore == 'false'
        run: cd android && ./gradlew assembleDebug

      - name: Rename APK artifact
        run: |
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$RELEASE_APK" ]; then
            mv "$RELEASE_APK" "android/app/build/outputs/apk/release/quickboard-android.apk"
          elif [ -f "$DEBUG_APK" ]; then
            mv "$DEBUG_APK" "android/app/build/outputs/apk/debug/quickboard-android-debug.apk"
          else
            echo "Error: No APK found at expected paths." >&2
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: android-apk
          path: |
            android/app/build/outputs/apk/release/quickboard-android.apk
            android/app/build/outputs/apk/debug/quickboard-android-debug.apk
          retention-days: 1

  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Clear Angular build cache
        run: rm -rf .angular

      - name: Build Angular app for mobile
        run: npm run build:mobile

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: cd ios/App && pod install

      - name: Install Apple Certificate and Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # import certificate and provisioning profile from secrets
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # apply provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

      - name: Build iOS App (Archive)
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -allowProvisioningUpdates \
            -archivePath $PWD/build/App.xcarchive \
            DEVELOPMENT_TEAM="KN5LT5X435" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="QuickBoard Distribution (App Store & TestFlight)" \
            archive

      - name: Export IPA
        run: |
          cd ios/App
          xcodebuild -exportArchive \
            -archivePath $PWD/build/App.xcarchive \
            -exportPath $PWD/build \
            -exportOptionsPlist ../../exportOptions.plist

      - name: Rename IPA
        run: |
          find ios/App/build -name "*.ipa" -exec mv {} ios/App/build/quickboard-ios.ipa \;

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v5
        with:
          name: ios-ipa
          path: ios/App/build/quickboard-ios.ipa
          retention-days: 1
